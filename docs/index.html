<!DOCTYPE HTML>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyFind</title>
    <link rel="stylesheet" href="./app.css?v=9" />
  </head>
  <body>
    <div id="root"></div>
    <script src="./app.js?v=9"></script>
    <script>
      // Au chargement, vérifier si l'utilisateur est connecté
      document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('sb-access-token');
        const userId = localStorage.getItem('sb-user-id');
        
        if (!token || !userId) {
          // Aucun token -> laisser app.js afficher l'écran de connexion
          console.log('No auth token - show login screen');
        } else {
          // Token présent -> valider via Supabase direct
          try {
            const res = await fetch('https://nkhcdkvepcjyxpwiattc.supabase.co/rest/v1/', {
              headers: { 'Authorization': `Bearer ${token}`, 'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5raGNka3ZlcGNqeXhwd2lhdHRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTc1OTYsImV4cCI6MjEwNTY3MzU5Nn0.uKPoW5qg5x7U777nGdjVfCIPyu-D1gG61Z_9iCcXqgg' }
            });
            if (!res.ok) {
              localStorage.removeItem('sb-access-token');
              localStorage.removeItem('sb-user-id');
            }
          } catch (e) {
            console.error('Auth check error:', e);
          }
        }
      });
    </script>
  </body>
</html>
