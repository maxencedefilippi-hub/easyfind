<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyFind - Connexion</title>
  <style>
    :root {
      --foreground: #1e293b;
      --muted-foreground: #64748b;
      --accent: #0f172a;
      --border: #cbd5e1;
      --card: #f1f5f9;
      --primary: #3b82f6;
      --success: #10b981;
      --error: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--foreground);
      background: var(--card);
      min-height: 100vh;
    }
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .auth-header {
      padding: 2rem 2rem 1rem;
      text-align: center;
    }
    .auth-header h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--foreground);
      margin: 0;
    }
    .auth-header p {
      color: var(--muted-foreground);
      margin-top: 0.5rem;
      font-size: 0.875rem;
    }
    .auth-body {
      padding: 0 2rem 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--foreground);
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .form-group input::placeholder {
      color: #94a3b8;
    }
    .auth-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .auth-action {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .auth-action:hover { opacity: 0.9; }
    .btn-signin {
      background: var(--primary);
      color: white;
      border: none;
    }
    .btn-signup {
      background: transparent;
      color: var(--foreground);
      border: 1px solid var(--border);
    }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
      position: relative;
    }
    .divider::before,
    .divider::after {
      content: "Ou continuer avec";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 0 0.5rem;
      font-size: 0.75rem;
      color: var(--muted-foreground);
    }
    .google-btn {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-top: 0.5rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--foreground);
      font-size: 0.875rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .google-btn:hover { border-color: #888; }
    .footer-small {
      margin-top: 1.5rem;
      color: var(--muted-foreground);
      font-size: 0.75rem;
      text-align: center;
    }
    .footer-small a {
      color: var(--primary);
      text-decoration: none;
    }
    .footer-small a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      .auth-card { margin: 1rem; }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>EasyFind</h1>
        <p>Application de recherche d'emplois</p>
      </div>
      <div class="auth-body">
        <form id="signup-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signup-email" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="signup-password" required autocomplete="new-password" />
          </div>
          <button type="submit" class="btn-signup" style="margin-top: 0.5rem;">
            Créer un compte
          </button>
        </form>
        <form id="signin-form" style="margin-top: 1.5rem;">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signin-email" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="signin-password" required autocomplete="current-password" />
          </div>
          <p style="margin: 0 0 1rem; text-align: right;">
            <a href="#" id="forgot-password" style="font-size: 0.8rem; color: var(--primary);">Mot de passe oublié ?</a>
          </p>
          <button type="submit" class="btn-signin">Se connecter</button>
        </form>
        <div class="divider" role="separator">Ou continuer avec</div>
        <button class="google-btn" id="google-signin-btn">
          Se connecter avec Google
        </button>
      </div>
      <p class="footer-small">
        Pas encore de compte ? <a href="#" id="link-signup">Inscrivez-vous</a> |
        <a href="#" id="link-signin">Connexion</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://nkhcdkvepcjyxpwiattc.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpvbmNlL2tXqgg";
    const supa = createClient(supabaseUrl, supabaseAnonKey);

    let currentUser = null;

    async function checkAuth() {
      const { data, error } = await supa.auth.getSession();
      if (error) {
        console.error("Auth error:", error);
        showLogin();
        return;
      }
      currentUser = data.session ? data.user : null;
      if (currentUser) {
        // Connecté → charger le dashboard
        document.body.innerHTML = "";
        const script = document.createElement("script");
        script.type = "module";
        script.src = "./app.js?v=18";
        script.defer = true;
        document.body.appendChild(script);
      } else {
        showLogin();
      }
    }

    function showLogin() {
      const html = `
        <!DOCTYPE html>
        <html lang="fr">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>EasyFind - Connexion</title>
          <style>
            :root { --foreground: #1e293b; --muted-foreground: #64748b; --accent: #0f172a; --border: #cbd5e1; --card: #f1f5f9; --primary: #3b82f6; }
            * { box-sizing: border-box; }
            body { margin: 0; font-family: system-ui, sans-serif; color: var(--foreground); background: var(--card); min-height: 100vh; }
            .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
            .auth-card { width: 100%; max-width: 420px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
            .auth-header { padding: 2rem 2rem 1rem; text-align: center; }
            .auth-header h1 { font-size: 1.75rem; font-weight: 600; color: var(--foreground); margin: 0; }
            .auth-header p { color: var(--muted-foreground); margin-top: 0.5rem; font-size: 0.875rem; }
            .auth-body { padding: 0 2rem 2rem; }
            .form-group { margin-bottom: 1.25rem; }
            .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--foreground); }
            .form-group input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 1rem; transition: border-color 0.2s; }
            .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
            .form-group input::placeholder { color: #94a3b8; }
            .auth-actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
            .auth-action { flex: 1; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
            .auth-action:hover { opacity: 0.9; }
            .btn-signin { background: var(--primary); color: white; border: none; }
            .btn-signup { background: transparent; color: var(--foreground); border: 1px solid var(--border); }
            .divider { height: 1px; background: var(--border); margin: 1.5rem 0; position: relative; }
            .divider::before, .divider::after { content: "Ou continuer avec"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 0 0.5rem; font-size: 0.75rem; color: var(--muted-foreground); }
            .google-btn { width: 100%; padding: 0.75rem 1rem; margin-top: 0.5rem; background: #fff; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--foreground); font-size: 0.875rem; cursor: pointer; transition: border-color 0.2s; }
            .google-btn:hover { border-color: #888; }
            .footer-small { margin-top: 1.5rem; color: var(--muted-foreground); font-size: 0.75rem; text-align: center; }
            .footer-small a { color: var(--primary); text-decoration: none; }
            .footer-small a:hover { text-decoration: underline; }
            @media (max-width: 480px) { .auth-card { margin: 1rem; } }
          </style>
        </head>
        <body>
          <div class="auth-container">
            <div class="auth-card">
              <div class="auth-header">
                <h1>EasyFind</h1>
                <p>Application de recherche d'emplois</p>
              </div>
              <div class="auth-body">
                <form id="signup-form">
                  <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signup-email" required autocomplete="email" />
                  </div>
                  <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="signup-password" required autocomplete="new-password" />
                  </div>
                  <button type="submit" class="btn-signup" style="margin-top: 0.5rem;">Créer un compte</button>
                </form>
                <form id="signin-form" style="margin-top: 1.5rem;">
                  <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signin-email" required autocomplete="email" />
                  </div>
                  <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="signin-password" required autocomplete="current-password" />
                  </div>
                  <p style="margin: 0 0 1rem; text-align: right;">
                    <a href="#" id="forgot-password" style="font-size: 0.8rem; color: var(--primary);">Mot de passe oublié ?</a>
                  </p>
                  <button type="submit" class="btn-signin">Se connecter</button>
                </form>
                <div class="divider" role="separator">Ou continuer avec</div>
                <button class="google-btn" id="google-signin-btn">Se connecter avec Google</button>
              </div>
              <p class="footer-small">
                Pas encore de compte ? <a href="#" id="link-signup">Inscrivez-vous</a> |
                <a href="#" id="link-signin">Connexion</a>
              </p>
            </div>
          </div>
        </body>
        </html>
      `;
      document.body.innerHTML = html;
      initForms();
    }

    function initForms() {
      // Basculer entre signup/signin
      document.getElementById("link-signup").addEventListener("click", e => {
        e.preventDefault();
        document.getElementById("signup-form").style.display = "block";
        document.getElementById("signin-form").style.display = "none";
      });
      document.getElementById("link-signin").addEventListener("click", e => {
        e.preventDefault();
        document.getElementById("signup-form").style.display = "none";
        document.getElementById("signin-form").style.display = "block";
      });

      // Mot de passe oublié
      document.getElementById("forgot-password").addEventListener("click", async e => {
        e.preventDefault();
        const email = document.getElementById("signin-email").value || prompt("Entrez votre email :");
        if (!email) return;
        const { error } = await supa.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname
        });
        if (error) alert(error.message);
        else alert("Email de réinitialisation envoyé ! Vérifiez votre boîte mail.");
      });

      // Soumettre signup
      document.getElementById("signup-form").addEventListener("submit", async e => {
        e.preventDefault();
        const email = document.getElementById("signup-email").value;
        const password = document.getElementById("signup-password").value;
        const { error } = await supa.auth.signUp({ email, password });
        if (error) alert(error.message);
        else alert("Compte créé ! Vérifiez votre email pour activer votre session.");
        checkAuth();
      });

      // Soumettre signin
      document.getElementById("signin-form").addEventListener("submit", async e => {
        e.preventDefault();
        const email = document.getElementById("signin-email").value;
        const password = document.getElementById("signin-password").value;
        const { data, error } = await supa.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
        else checkAuth();
      });

      // Google Sign-in
      document.getElementById("google-signin-btn").addEventListener("click", async () => {
        const { error } = await supa.auth.signInWithOAuth({
          provider: "google",
        });
        if (error) alert(error.message);
      });
    }

    // Démarrage
    checkAuth();
  </script>
</body>
</html>
