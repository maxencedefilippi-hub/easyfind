<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyFind - Connexion</title>
  <style>
    :root {
      --foreground: #1e293b;
      --muted-foreground: #64748b;
      --accent: #0f172a;
      --border: #cbd5e1;
      --card: #f1f5f9;
      --primary: #16a34a;
      --primary-hover: #15803d;
      --primary-light: #dcfce7;
      --success: #10b981;
      --error: #ef4444;
      --background: #f0fdf4;
      --surface: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--foreground);
      background: var(--background);
      min-height: 100vh;
    }
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(22, 163, 74, 0.1), 0 4px 16px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .auth-header {
      padding: 2.5rem 2rem 1.5rem;
      text-align: center;
      background: linear-gradient(135deg, var(--primary-light) 0%, #f0fdf4 100%);
      border-bottom: 1px solid var(--border);
    }
    .auth-header .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 1rem;
      background: var(--primary);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
    }
    .auth-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--foreground);
      margin: 0;
      letter-spacing: -0.02em;
    }
    .auth-header p {
      color: var(--muted-foreground);
      margin-top: 0.5rem;
      font-size: 0.95rem;
      font-weight: 400;
    }
    .auth-body {
      padding: 2rem;
    }
    .form-section {
      margin-bottom: 1.5rem;
      padding: 1.5rem;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .form-section-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .form-section-title::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 2px;
    }
    .form-group {
      margin-bottom: 1.125rem;
    }
    .form-group:last-of-type { margin-bottom: 0; }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--foreground);
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: var(--surface);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
    }
    .form-group input::placeholder {
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      padding: 0.875rem 1.5rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .btn-signin {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
    }
    .btn-signin:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
      transform: translateY(-1px);
    }
    .btn-signin:active { transform: translateY(0); }
    .btn-signup {
      background: transparent;
      color: var(--foreground);
      border: 1.5px solid var(--border);
    }
    .btn-signup:hover {
      background: var(--card);
      border-color: var(--muted-foreground);
    }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }
    .google-btn {
      width: 100%;
      padding: 0.875rem 1rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      color: var(--foreground);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .google-btn:hover {
      border-color: #888;
      background: var(--card);
    }
    .google-btn svg { width: 20px; height: 20px; }
    .footer-small {
      margin-top: 1.5rem;
      color: var(--muted-foreground);
      font-size: 0.8rem;
      text-align: center;
    }
    .footer-small a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .footer-small a:hover { text-decoration: underline; }
    .forgot-link {
      display: block;
      text-align: right;
      margin: -0.25rem 0 1rem;
      font-size: 0.825rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-link:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      .auth-card { margin: 0.5rem; }
      .auth-body { padding: 1.5rem; }
      .form-section { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">EF</div>
        <h1>EasyFind</h1>
        <p>Application de candidature spontanée personnalisée</p>
      </div>
      <div class="auth-body">
        <section class="form-section">
          <h2 class="form-section-title">Créer un compte</h2>
          <form id="signup-form">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="signup-email" required autocomplete="email" placeholder="vous@exemple.com" />
            </div>
            <div class="form-group">
              <label>Mot de passe</label>
              <input type="password" id="signup-password" required autocomplete="new-password" placeholder="••••••••" />
            </div>
            <button type="submit" class="btn btn-signup" style="margin-top: 0.5rem;">
              Créer un compte
            </button>
          </form>
        </section>

        <section class="form-section">
          <h2 class="form-section-title">Se connecter</h2>
          <form id="signin-form">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="signin-email" required autocomplete="email" placeholder="vous@exemple.com" />
            </div>
            <div class="form-group">
              <label>Mot de passe</label>
              <input type="password" id="signin-password" required autocomplete="current-password" placeholder="••••••••" />
            </div>
            <a href="#" id="forgot-password" class="forgot-link">Mot de passe oublié ?</a>
            <button type="submit" class="btn btn-signin">Se connecter</button>
          </form>
        </section>

        <div class="divider"></div>

        <button class="google-btn" id="google-signin-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#ea4335" d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.327,0-6.033-2.706-6.033-6.033s2.706-6.032,6.033-6.032c1.498,0,2.866,0.539,3.921,1.378l2.815-2.815C17.553,1.797,15.312,0.552,12.545,0.552C7.388,0.552,3.27,4.672,3.27,9.83c0,1.642,0.468,3.162,1.262,4.487H0.956v3.861h4.944C6.924,20.869,10.051,23.04,13.808,23.04c8.154,0,12.545-6.63,12.545-14.796C26.353,10.913,22.434,6.793,17.544,6.271L17.544,6.271z"/>
            <path fill="#4285f4" d="M12.545,5.276c2.048,0,3.867,0.659,5.219,1.809l-3.555,3.555c-0.727-0.615-1.666-0.971-2.728-0.971c-2.21,0-4.004,1.794-4.004,4.005s1.794,4.005,4.004,4.005c1.184,0,2.236-0.42,3.038-1.066l3.308,3.308C17.167,21.133,14.817,22.545,12.545,22.545C6.366,22.545,1.5,17.677,1.5,11.5C1.5,5.323,6.366,0.455,12.545,0.455C15.922,0.455,19.002,1.489,21.138,3.625L19.391,5.372C17.869,3.849,15.564,3.078,12.545,3.078C10.022,3.078,7.873,3.98,6.376,5.672L12.545,5.276z"/>
            <path fill="#fbbc05" d="M12.545,0.552C15.312,0.552,17.553,1.797,19.448,3.888L17.544,6.271C14.817,3.98,12.545,3.078,10.022,3.078C7.873,3.98,6.376,5.672,6.376,5.672L0.956,4.328C3.27,4.672,7.388,0.552,12.545,0.552z"/>
            <path fill="#34a853" d="M12.545,22.545c2.252,0,4.17-0.675,5.724-1.868l-3.308-3.308c-0.802,0.646-1.854,1.066-3.038,1.066c-2.21,0-4.004-1.794-4.004-4.005s1.794-4.005,4.004-4.005c1.062,0,2.001,0.356,2.728,0.971l3.555-3.555C16.412,1.218,14.593,0.552,12.545,0.552C7.388,0.552,3.27,4.672,3.27,9.83c0,1.777,0.517,3.431,1.406,4.874H0.956v3.861h4.944C6.924,20.869,10.051,23.04,13.808,23.04c3.757,0,6.884-2.171,8.402-5.238L12.545,22.545z"/>
          </svg>
          Continuer avec Google
        </button>
      </div>
      <p class="footer-small">
        Pas encore de compte ? <a href="#" id="link-signup">Inscrivez-vous</a> |
        <a href="#" id="link-signin">Connexion</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://nkhcdkvepcjyxpwiattc.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpvbmNlL2tXqgg";
    const supa = createClient(supabaseUrl, supabaseAnonKey);

    let currentUser = null;

    async function checkAuth() {
      const { data, error } = await supa.auth.getSession();
      if (error) {
        console.error("Auth error:", error);
        showLogin();
        return;
      }
      currentUser = data.session ? data.user : null;
      if (currentUser) {
        document.body.innerHTML = "";
        const script = document.createElement("script");
        script.type = "module";
        script.src = "./app.js?v=19";
        script.defer = true;
        document.body.appendChild(script);
      } else {
        showLogin();
      }
    }

    function showLogin() {
      // Already rendered in HTML, just init forms
      initForms();
    }

    function initForms() {
      // Toggle between signup/signin
      document.getElementById("link-signup").addEventListener("click", e => {
        e.preventDefault();
        document.getElementById("signup-form").style.display = "block";
        document.getElementById("signin-form").style.display = "none";
      });
      document.getElementById("link-signin").addEventListener("click", e => {
        e.preventDefault();
        document.getElementById("signup-form").style.display = "none";
        document.getElementById("signin-form").style.display = "block";
      });

      // Forgot password
      document.getElementById("forgot-password").addEventListener("click", async e => {
        e.preventDefault();
        const email = document.getElementById("signin-email").value || prompt("Entrez votre email :");
        if (!email) return;
        const { error } = await supa.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname
        });
        if (error) alert(error.message);
        else alert("Email de réinitialisation envoyé ! Vérifiez votre boîte mail.");
      });

      // Submit signup
      document.getElementById("signup-form").addEventListener("submit", async e => {
        e.preventDefault();
        const email = document.getElementById("signup-email").value;
        const password = document.getElementById("signup-password").value;
        const { error } = await supa.auth.signUp({ email, password });
        if (error) alert(error.message);
        else alert("Compte créé ! Vérifiez votre email pour activer votre session.");
        checkAuth();
      });

      // Submit signin
      document.getElementById("signin-form").addEventListener("submit", async e => {
        e.preventDefault();
        const email = document.getElementById("signin-email").value;
        const password = document.getElementById("signin-password").value;
        const { data, error } = await supa.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
        else checkAuth();
      });

      // Google Sign-in
      document.getElementById("google-signin-btn").addEventListener("click", async () => {
        const { error } = await supa.auth.signInWithOAuth({
          provider: "google",
        });
        if (error) alert(error.message);
      });
    }

    // Start
    checkAuth();
  </script>
</body>
</html>
